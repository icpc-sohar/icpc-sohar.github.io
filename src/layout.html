<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{t:site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{t:site_name}}">
<meta property="og:locale" content="{{t:og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B427B">
<link rel="icon" href="{{root}}assets/icons/favicon.ico" sizes="48x48">
<link rel="icon" href="{{root}}assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/icons/apple-touch-icon.png">
<script>
  // Before first paint: light unless the visitor chose dark before.
  (function () {
    var t = 'light';
    try { if (localStorage.getItem('icpc-theme') === 'dark') t = 'dark'; } catch (e) {}
    document.documentElement.dataset.theme = t;
    document.documentElement.classList.add('js'); // motion styles apply only when the script can reveal content
  })();
</script>
<link rel="preload" href="{{root}}assets/fonts/{{t:font_head}}.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/fonts/{{t:font_body}}.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/site.css">
</head>
<body data-page="{{page}}">
{{intro}}
<a class="skip" href="#main">{{t:skip}}</a>
<header class="header on-dark"><div class="wrap">
  <a class="brand" href="{{home_url}}"><img src="{{root}}assets/logos/club/icpc-su-mark-ondark.svg" alt="" width="44" height="44">
    <span><b>{{t:brand_line1}}</b><small>{{t:brand_line2}}</small></span></a>
  <nav class="nav" id="nav" aria-label="{{t:nav_label}}">{{nav}}
    <a class="btn btn-sun nav-join" href="{{join_url}}">{{t:join_short}}</a></nav>
  <button class="icon-btn theme" type="button" aria-label="{{t:theme_label}}" aria-pressed="false">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>
  {{alt_link}}
  <a class="btn btn-sun header-join" href="{{join_url}}">{{t:join_short}}</a>
  <button class="icon-btn menu" type="button" aria-label="{{t:menu}}" aria-expanded="false" aria-controls="nav">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path class="l1" d="M4 7h16"/><path class="l2" d="M4 12h16"/><path class="l3" d="M4 17h10"/></svg>
  </button>
</div></header>

<main id="main">
{{content}}
</main>

<div class="wrap"><div class="under">
  <small>{{t:supervised}}</small>
  <div class="under-logos">
    <img class="su only-light" src="{{root}}assets/logos/su/su-horizontal-icon-right.svg" alt="{{t:su_alt}}" width="245" height="56" loading="lazy">
    <img class="su only-dark" src="{{root}}assets/logos/su/su-white-horizontal-icon-right.svg" alt="{{t:su_alt}}" width="245" height="56" loading="lazy">
    <i></i>
    <img class="club only-light" src="{{root}}assets/logos/club/icpc-su-mark.svg" alt="{{t:club_alt}}" width="56" height="56" loading="lazy">
    <img class="club only-dark" src="{{root}}assets/logos/club/icpc-su-mark-ondark.svg" alt="{{t:club_alt}}" width="56" height="56" loading="lazy">
  </div>
</div></div>

<footer class="footer on-dark"><div class="wrap">
  <div><img class="su" src="{{root}}assets/logos/su/su-white-horizontal-icon-right.svg" alt="{{t:su_alt}}" width="210" height="48" loading="lazy">
    <p class="sup">{{t:supervision}}</p></div>
  <p class="copy">{{t:copyright}}</p>
  <div class="social">
    <a href="https://www.instagram.com/icpc_sohar/" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://www.linkedin.com/company/icpc-sohar-community/" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 11v5.5M12 16.5V11m0 2.5a2.25 2.25 0 0 1 4.5 0v3"/><circle cx="8" cy="7.9" r="1" fill="currentColor" stroke="none"/></svg></a>
    <a href="https://x.com/icpc_sohar" rel="noopener" aria-label="X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.3L5.3 21H2.2l7.3-8.3L1.9 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg></a>
  </div>
</div></footer>
<script src="{{root}}assets/js/site.js" defer></script>
</body>
</html>
