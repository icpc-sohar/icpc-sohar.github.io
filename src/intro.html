<script>
  // Home intro: once per browser session, never for reduced motion. Decided before anything paints.
  (function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    try { if (sessionStorage.getItem('icpc-intro-seen')) return; sessionStorage.setItem('icpc-intro-seen', '1'); } catch (e) { return; }
    document.documentElement.classList.add('intro-on');
  })();
</script>
<div class="intro" role="dialog" aria-modal="true" aria-label="{{t:site_name}}">
  <div class="intro-in">
    <svg class="intro-mark" viewBox="-100 -100 200 200" aria-hidden="true"><g transform="scale(0.118)">
      <g class="arm" style="--k:0"><g><path d="M248 -535 L-7 -605 Q-140 -430 -357 -420 L-417 -115 Q-360 85 -197 150" fill="none" stroke="#7FB8EC" stroke-width="138" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-260" cy="-660" r="105" fill="#7FB8EC"/></g></g>
      <g class="arm" style="--k:1"><g transform="rotate(120)"><path d="M248 -535 L-7 -605 Q-140 -430 -357 -420 L-417 -115 Q-360 85 -197 150" fill="none" stroke="#F2B43C" stroke-width="138" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-260" cy="-660" r="105" fill="#F2B43C"/></g></g>
      <g class="arm" style="--k:2"><g transform="rotate(240)"><path d="M248 -535 L-7 -605 Q-140 -430 -357 -420 L-417 -115 Q-360 85 -197 150" fill="none" stroke="#FF8A93" stroke-width="138" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-260" cy="-660" r="105" fill="#FF8A93"/></g></g>
      <path class="core" fill="#FFFFFF" d="M-32 -118H32V-88H92V-30H122V30H92V88H32V118H-32V88H-92V30H-122V-30H-92V-88H-32Z"/>
    </g></svg>
    <p class="intro-name">{{t:site_name}}</p>
    <img class="intro-su" src="{{root}}assets/logos/su/su-white-horizontal-icon-right.svg" alt="{{t:su_alt}}" width="210" height="48" fetchpriority="low" decoding="async">
  </div>
  <button class="intro-skip" type="button">{{t:intro_skip}}</button>
</div>
